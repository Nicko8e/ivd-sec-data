name: SEC data for Google Sheets

on:
  schedule:
    - cron: "23 2 * * *"      # every day 02:23 UTC (only new filings are fetched)
  workflow_dispatch:           # "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sec-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore what was already extracted
        uses: actions/cache/restore@v4
        with:
          path: .sec-cache
          key: sec-cache-${{ github.run_id }}
          restore-keys: sec-cache-
      - name: Fetch new SEC data and build tables
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/sec_tables.py _site
      - name: Update full financial statements (only companies with new filings)
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/company_financials.py _site
      - name: Remember what was extracted
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sec-cache
          key: sec-cache-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
